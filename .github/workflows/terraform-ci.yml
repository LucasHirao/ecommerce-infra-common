# CI: executa em branches feature/** e abre PR para sandbox
name: Terraform CI

on:
  push:
    branches:
      - 'feature/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  validate-and-plan:
    name: Validate & Plan
    runs-on: ubuntu-latest
    environment: sandbox
    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check AWS credentials (CI)
        run: |
          if [ -z "${{ secrets.AWS_ACCESS_KEY_ID }}" ] || [ -z "${{ secrets.AWS_SECRET_ACCESS_KEY }}" ] || [ -z "${{ secrets.AWS_REGION }}" ]; then
            echo "::error::Configure AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY e AWS_REGION em Repository secrets ou no environment 'sandbox' (Settings → Secrets and variables → Actions)"
            exit 1
          fi
          echo "Credenciais AWS configuradas."

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6"
          terraform_wrapper: false

      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan (dry run)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          terraform init
          terraform plan -no-color -input=false -out=tfplan

      - name: Open PR to sandbox
        id: open-pr
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          PR_URL=$(gh pr create --base sandbox --head "${{ github.ref_name }}" \
            --title "Infra: ${{ github.ref_name }} → sandbox" \
            --body "## Terraform CI

          - **Branch:** \`${{ github.ref_name }}\`
          - **Commit:** ${{ github.sha }}
          - Validação e plan executados com sucesso.

          Aprove este PR para promover para **sandbox** e disparar o CD." 2>&1)
          EXIT=$?
          set -e
          if [ $EXIT -eq 0 ]; then
            echo "PR criado: $PR_URL"
            echo "pr_url=$PR_URL" >> $GITHUB_OUTPUT
          elif echo "$PR_URL" | grep -qi "already exists"; then
            EXISTING=$(gh pr view --base sandbox --head "${{ github.ref_name }}" --json url -q .url 2>/dev/null || true)
            echo "PR já existe para esta branch: $EXISTING"
          else
            echo "::error::Falha ao criar PR: $PR_URL"
            exit 1
          fi
