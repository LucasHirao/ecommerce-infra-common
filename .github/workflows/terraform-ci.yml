# CI: executa em branches feature/** e abre PR para sandbox
name: Terraform CI

on:
  push:
    branches:
      - 'feature/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  validate-and-plan:
    name: Validate & Plan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6"
          terraform_wrapper: false

      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan (dry run)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          terraform init
          terraform plan -no-color -input=false -out=tfplan
        continue-on-error: true

      - name: Open PR to sandbox
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_URL=$(gh pr create --base sandbox --head "${{ github.ref_name }}" \
            --title "Infra: ${{ github.ref_name }} → sandbox" \
            --body "## Terraform CI
          - **Branch:** \`${{ github.ref_name }}\`
          - **Commit:** ${{ github.sha }}
          - Validação e plan executados.
          Aprove este PR para promover para **sandbox** e disparar o CD." \
            2>&1) || true
          if echo "$PR_URL" | grep -q "already exists"; then
            echo "PR já existe para esta branch."
          else
            echo "PR criado: $PR_URL"
          fi
